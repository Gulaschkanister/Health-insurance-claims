# Daempft die Protokollierung waehrend der Tests.
#
# Hibernate meldet je Testfall den Verbindungsaufbau samt JDBC-URL und
# Poolgroesse. Bei 13 Persistenztests sind das ueber hundert Zeilen, in denen
# das eigentliche Testergebnis untergeht.
#
# Warnungen und Fehler bleiben sichtbar - nur die Betriebsmeldungen entfallen.
handlers = java.util.logging.ConsoleHandler
.level = WARNING

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s %5$s%6$s%n

org.hibernate.level = WARNING
org.hibernate.orm.level = WARNING
org.hibernate.orm.connections.pooling.level = SEVERE
org.hibernate.orm.deprecation.level = SEVERE
